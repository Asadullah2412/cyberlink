<!DOCTYPE html>
<html>

<head>
    <title>Netrunner Chat // Secure Terminal</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --dark-bg: #0a0a12;
            --grid-color: #14142b;
            --panel-bg: #111122;
            --text-color: #e0e0ff;
            --dim-green: #39ff14;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .chat-container {
            background-color: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px rgba(0, 240, 255, 0.2);
            padding: 25px;
            width: 100%;
            max-width: 600px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .chat-container::before {
            content: "SYSTEM ACTIVE // SECURE_NODE";
            position: absolute;
            top: 4px;
            right: 10px;
            font-size: 0.65rem;
            color: var(--neon-pink);
            letter-spacing: 1px;
        }

        h1 {
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-top: 0;
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px var(--neon-cyan);
            border-bottom: 1px solid var(--neon-pink);
            padding-bottom: 10px;
            position: relative;
        }

        h2 {
            font-size: 0.9rem;
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            margin-bottom: 20px;
        }

        #messages {
            list-style-type: none;
            padding: 10px;
            margin: 0 0 20px 0;
            height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(0, 240, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        #messages li {
            padding: 6px 10px;
            margin-bottom: 8px;
            border-left: 3px solid var(--neon-cyan);
            background: rgba(20, 20, 43, 0.6);
            font-size: 0.95rem;
            word-break: break-all;
            display: flex;
            flex-direction: column;
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--dim-green);
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .msg-body {
            color: var(--text-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: #05050a;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.2);
        }

        input[type="text"]:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink), inset 0 0 5px rgba(255, 0, 85, 0.2);
            color: var(--neon-pink);
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 0 25px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px var(--neon-pink);
        }

        button:hover {
            background-color: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #05050a;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            box-shadow: 0 0 5px var(--neon-cyan);
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <h1 id="glitch-title">Neon Net Chat</h1>
        <h2>ID//_ <span id="ws-id"></span></h2>

        <ul id='messages'>
        </ul>

        <form action="" onsubmit="sendMessage(event)">
            <div class="input-group">
                <input type="text" id="messageText" autocomplete="off" placeholder="Transmit data..." />
                <button>Send</button>
            </div>
        </form>
    </div>

    <script>
        // Audio Context Setup for Terminal Beep
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playBeep(freq = 600, duration = 0.05, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type;
                oscillator.frequency.value = freq;
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); // keep volume subtle
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio contextual block overridden until user interacts.");
            }
        }

        // Glitch Text Effect for Title
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const titleElement = document.querySelector("#glitch-title");
        const originalText = titleElement.innerText;

        function triggerGlitch() {
            let iteration = 0;
            clearInterval(glitchInterval);

            glitchInterval = setInterval(() => {
                titleElement.innerText = originalText
                    .split("")
                    .map((letter, index) => {
                        if (index < iteration) return originalText[index];
                        return letters[Math.floor(Math.random() * letters.length)];
                    })
                    .join("");

                if (iteration >= originalText.length) clearInterval(glitchInterval);
                iteration += 1 / 3;
            }, 30);
        }
        let glitchInterval = null;
        setInterval(triggerGlitch, 6000); // Glitches every 6 seconds

        // WebSockets System
        var client_id = Date.now();
        document.querySelector("#ws-id").textContent = client_id;
        var ws = new WebSocket(`ws://localhost:8000/ws/${client_id}`);

        ws.onmessage = function (event) {
            var messages = document.getElementById('messages');
            var message = document.createElement('li');

            // Get accurate system timestamp
            var now = new Date();
            var timeString = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;

            var timestampSpan = document.createElement('span');
            timestampSpan.className = 'timestamp';
            timestampSpan.innerText = `${timeString} incoming_packet:`;

            var bodySpan = document.createElement('span');
            bodySpan.className = 'msg-body';
            bodySpan.innerText = `> ${event.data}`;

            message.appendChild(timestampSpan);
            message.appendChild(bodySpan);
            messages.appendChild(message);

            messages.scrollTop = messages.scrollHeight;
            playBeep(880, 0.08, 'square'); // Synth blip sound on incoming
        };

        function sendMessage(event) {
            var input = document.getElementById("messageText");
            if (input.value.trim() !== "") {
                ws.send(input.value);
                input.value = '';
                playBeep(440, 0.04, 'sine'); // Outgoing feedback click
            }
            event.preventDefault();
        }
    </script>
</body>

</html>
